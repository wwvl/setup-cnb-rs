name: "Setup cnb-rs"
description: "在 GitHub Actions 中安装 cnb-rs CLI 工具"
author: "wwvo"

branding:
  icon: "terminal"
  color: "blue"

inputs:
  version:
    description: "要安装的 cnb-rs 版本"
    required: false
    default: "v1.0.0-beta.4"
  source:
    description: "下载源 (cnb 或 github)"
    required: false
    default: "cnb"

outputs:
  version:
    description: "已安装的 cnb-rs 版本"
    value: ${{ steps.verify.outputs.version }}
  bin-path:
    description: "cnb-rs 二进制文件所在目录"
    value: ${{ steps.verify.outputs.bin-path }}

runs:
  using: "composite"
  steps:
    - name: Install cnb-rs (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        CNB_RS_VERSION: ${{ inputs.version }}
        CNB_RS_SOURCE: ${{ inputs.source }}
        CNB_RS_BIN_DIR: ${{ runner.temp }}/cnb-rs-bin
      run: bash "${{ github.action_path }}/scripts/install.sh"

    - name: Install cnb-rs (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CNB_RS_VERSION: ${{ inputs.version }}
        CNB_RS_SOURCE: ${{ inputs.source }}
        CNB_RS_BIN_DIR: ${{ runner.temp }}/cnb-rs-bin
      run: |
        & "${{ github.action_path }}/scripts/install.ps1"

    - name: Add cnb-rs to PATH
      shell: bash
      run: |
        echo "${{ runner.temp }}/cnb-rs-bin" >> "$GITHUB_PATH"

    - name: Verify installation
      id: verify
      shell: bash
      run: |
        installed_version="$(cnb-rs --version 2>/dev/null | head -n 1 || echo 'unknown')"
        bin_path="${{ runner.temp }}/cnb-rs-bin"
        echo "version=${installed_version}" >> "$GITHUB_OUTPUT"
        echo "bin-path=${bin_path}" >> "$GITHUB_OUTPUT"
        echo "✅ cnb-rs ${installed_version} is ready"
