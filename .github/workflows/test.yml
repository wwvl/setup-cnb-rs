name: Test setup-cnb-rs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup cnb-rs
        id: setup
        uses: ./
        with:
          version: v1.0.0-alpha.1

      - name: Verify cnb-rs is available
        shell: bash
        run: |
          cnb-rs --version
          echo "Action outputs:"
          echo "  version:  ${{ steps.setup.outputs.version }}"
          echo "  bin-path: ${{ steps.setup.outputs.bin-path }}"
